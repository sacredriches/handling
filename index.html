<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ground Handling Price Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Layout: ops-console — airport roster on the left, selected airport's handler comparison on the right; aircraft type is a global switch */
:root{
  --page:#64202B; --on-page:#FBF1EC; --on-page-2:#E9CFC4; --copper:#D7A988;
  --bg:#FAF1F1; --panel:#FFFFFF; --panel-2:#FFF6F6; --line:#E9D3D5; --line-soft:#F4E6E7;
  --ink:#2B1719; --ink-2:#604749; --muted:#90787A;
  --accent:#A3414C; --accent-soft:#F6E3E5; --bar:#C26C74; --bar-track:#F3E6E7;
  --good:#1F7A4D; --good-soft:#DFF1E7; --warn:#A35F00; --warn-soft:#FBEBD2; --crit:#B03A2E;
  --amber:#E2A400;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170F10; --panel:#221517; --panel-2:#2B1B1D; --line:#45292D; --line-soft:#352225;
  --ink:#F3E7E8; --ink-2:#CBB0B3; --muted:#9C8184;
  --accent:#EC9A9F; --accent-soft:#46191E; --bar:#C46A72; --bar-track:#321F22;
  --good:#5CCB92; --good-soft:#163527; --warn:#E8A84A; --warn-soft:#3A2A12; --crit:#EE7B6E;
  --amber:#F0C040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170F10; --panel:#221517; --panel-2:#2B1B1D; --line:#45292D; --line-soft:#352225;
  --ink:#F3E7E8; --ink-2:#CBB0B3; --muted:#9C8184;
  --accent:#EC9A9F; --accent-soft:#46191E; --bar:#C46A72; --bar-track:#321F22;
  --good:#5CCB92; --good-soft:#163527; --warn:#E8A84A; --warn-soft:#3A2A12; --crit:#EE7B6E;
  --amber:#F0C040; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:60px;height:60px;border-radius:12px;flex:none;display:block;box-shadow:0 0 0 1px rgba(215,169,136,.35)}
.brand-t{display:flex;flex-direction:column;gap:2px}
header.top .brand h1{color:var(--on-page)}
header.top .brand .eyebrow{color:var(--copper)}
header.top .tabs{border-bottom-color:rgba(251,241,236,.25)}
header.top .tabs button{color:var(--on-page-2)}
header.top .tabs button:hover{color:var(--on-page)}
header.top .tabs button[aria-selected="true"]{color:var(--on-page);border-bottom-color:var(--copper)}
.brand .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.01em;line-height:1}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{font:600 14px/1 var(--f-mono);letter-spacing:.04em;border:0;background:transparent;color:var(--ink-2);padding:8px 12px;border-radius:6px;cursor:pointer}
.seg button:hover{color:var(--ink);background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.seg-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
button:focus-visible,input:focus-visible,.ap:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1}
.kpi .s{font-size:13px;color:var(--ink-2)}

.main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.roster{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px)}
.roster-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.roster-head input{width:100%;font:15px var(--f-body);padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink)}
.roster-head .hint{font-size:12px;color:var(--muted)}
.list{overflow:auto;padding:6px}
.vtick{display:inline-grid;place-items:center;box-sizing:border-box;width:13px;height:13px;margin-left:5px;border-radius:50%;background:var(--ver);color:#fff;font-family:var(--f-body);font-weight:700;font-size:8.5px;line-height:1;vertical-align:.35em;letter-spacing:0}
.ap-head .icao .vtick{width:20px;height:20px;margin-left:8px;font-size:12px;vertical-align:.95em}
.kpi .vtick{vertical-align:.05em;margin:0 2px}
.kpi-ver{color:var(--ver);display:inline-flex;align-items:center;gap:6px}
.kpi-ver .vtick{width:20px;height:20px;font-size:12px;margin:0}
.ap{display:grid;grid-template-columns:90px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.ap:hover{background:var(--panel-2)}
.ap[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.ap .code{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.03em;white-space:nowrap}
.ap .code.ver,.ap-head .icao.ver{color:var(--ver);font-weight:800}
:root{--ver:#0E9F52}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ver:#4ADE80}}
:root[data-theme="dark"]{--ver:#4ADE80}
.ver-t{color:var(--good);font-weight:700}
.chip.ver{color:var(--good);background:var(--good-soft);font-weight:700}
.ap .meta{font-size:12.5px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .price{text-align:right;font-size:13px}
.ap .price small{display:block;color:var(--muted);font-family:var(--f-body);font-size:11px}
.ap.dim .code,.ap.dim .price,.ap.dim .meta{color:var(--muted)}
.ap.dim .code.ver{color:var(--ver)}

.detail{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.card-h h2,.card-h h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:.02em}
.card-h h3{font-size:20px}
.card-h .sub{font-size:13px;color:var(--muted)}
.card-b{padding:16px 18px}

.ap-head{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:18px}
.ap-head .icao{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:.9;letter-spacing:.02em}
.ap-head .facts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ap-upd{margin-left:auto;display:flex;flex-direction:column;gap:3px;text-align:right;align-items:flex-end;padding-left:18px;border-left:1px solid var(--line-soft)}
.ap-upd .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ap-upd .v{font:600 20px var(--f-display);display:flex;align-items:center}
.ap-upd .s{font-size:13px;color:var(--ink-2)}
@media (max-width:640px){.ap-upd{margin-left:0;text-align:left;align-items:flex-start;padding-left:0;border-left:0}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.notes{margin:0 18px 18px;padding:10px 14px;border-left:3px solid var(--amber);background:var(--panel-2);font-size:14px;color:var(--ink-2);border-radius:0 6px 6px 0}

.scen{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);border:1px solid var(--line);padding:6px 10px;border-radius:7px;cursor:pointer;background:var(--panel)}
.tog input{accent-color:var(--accent);margin:0}
.tog[data-off="true"]{opacity:.5;cursor:not-allowed}

.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 120px;gap:12px;align-items:center;position:relative}
.brow .hn{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .hn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.track{height:22px;background:var(--bar-track);border-radius:0 4px 4px 0;position:relative}
.fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0;transition:width .35s ease}
.fill.best{background:var(--good)}
.fill.partial{background:repeating-linear-gradient(135deg,var(--bar) 0 4px,var(--bar-track) 4px 8px)}
.fill .ext{position:absolute;top:0;height:100%;background:var(--amber);opacity:.55;border-radius:0 4px 4px 0}
.bval{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.bval .t{font-size:15px;font-weight:500}
.bval .d{font-size:12px;color:var(--muted)}
.bval .d.best{color:var(--good);font-weight:600}
.brow:hover .hn{color:var(--accent)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12.5px;padding:8px 10px;border-radius:6px;z-index:10;max-width:260px;line-height:1.4}
.tip .num{color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:6px}
.empty{padding:28px 18px;color:var(--ink-2);font-size:14px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
thead th{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--ink);background:var(--panel-2);border-bottom:1px solid var(--line)}
thead th:first-child{background:var(--panel-2)}
tbody td:first-child{color:var(--ink-2)}
td.min{color:var(--good);font-weight:600}
td.min::before{content:"▼ ";font-size:9px;vertical-align:1px}
td.txt{color:var(--muted);font-family:var(--f-body);font-size:13px}
td.txt{white-space:normal;min-width:90px;max-width:150px;line-height:1.3}
thead th:not(:first-child){white-space:normal;overflow-wrap:break-word;min-width:90px;max-width:170px;line-height:1.2;vertical-align:bottom}
td.na{color:var(--line)}
tr.sum td{border-top:2px solid var(--line);border-bottom:0;font-weight:600;color:var(--ink);background:var(--panel-2)}
tr.sum td:first-child{background:var(--panel-2);color:var(--ink)}
.tick-w{display:inline-flex;gap:10px;margin-left:8px;align-items:center;flex-wrap:wrap}
tr.off td{opacity:.5}
.tick-l{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer}
tr.g-x:has(input[data-tick]:checked) td{color:var(--ink)}
.qty-in{width:52px;margin-left:6px;padding:2px 6px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);text-align:right}
tr.disb td{color:var(--ink-2);font-size:13px}
.foot{font-size:12.5px;color:var(--muted);padding:10px 18px 14px}

.overview table td:first-child{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.03em}
.overview tbody tr{cursor:pointer}
.overview tbody tr:hover td{background:var(--panel-2)}
.spread{display:inline-block;min-width:54px}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;font-family:var(--f-body);font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.vc-warn{margin:10px 16px 0;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.pill.mute{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .roster{position:static;max-height:none}
  .list{max-height:300px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .brow{grid-template-columns:minmax(0,1fr) 100px}
  .brow .track{grid-column:1 / -1;order:3}
  .ap-head .icao{font-size:44px}
  .brand h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

[hidden]{display:none!important}
.bars{gap:22px}
.brow{min-height:42px}
.track,.fill{border-radius:999px}
.fill{overflow:hidden;position:relative}
.fill .ext{border-radius:0}
.legend i{border-radius:999px}
.sc-line{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.sc-chip{font-size:11px;font-weight:500;padding:2px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.sc-chip.on{background:var(--warn-soft);border-color:var(--amber);color:var(--warn);font-weight:600}
.sc-chip.none{color:var(--muted)}
tr.grp.g-sc td{color:var(--warn)}
tr.sc-row td{vertical-align:middle}
.sc-amt{font-size:11.5px;color:var(--warn);font-weight:600}
@media (max-width:560px){.brow{grid-template-columns:minmax(0,1fr) 140px}.bval .t{white-space:nowrap;font-size:14px}}
.bval .usd{font-size:12px;color:var(--muted)}
.fx-note{margin-top:10px;font-size:12.5px;color:var(--muted)}
td .usd{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.fx-box{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.fx-box:empty{display:none}
.fx-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fx-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.fx-in{width:90px;font:14px var(--f-mono);padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink);text-align:right}
.fx-in.bad{border-color:var(--crit)}
.fx-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fx-act .hint{font-size:12px;color:var(--muted)}
.fx-act .hint.ok{color:var(--good)} .fx-act .hint.err{color:var(--crit)}
.calc-grid{display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px 22px;min-height:100%}
.calc{display:flex;flex-direction:column}
.ap-id{display:flex;flex-direction:column;gap:6px}
.ctry{font-size:16px;font-weight:500;color:var(--ink-2);letter-spacing:.01em}
#detail>section.card:first-child{display:flex;flex-direction:column;justify-content:center}
#detail>section.card:first-child,#detail>section.card.calc{min-height:122px}
.calc>.calc-grid{flex:1}
.ap-ac{margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ap-ac .flabel{font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:700px){.ap-ac{margin-left:0}}
.calc-row{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-start}
.calc-f{display:flex;flex-direction:column;gap:8px;min-width:0}
.calc-f .flabel{display:block;font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);height:16px}
.calc-in{box-sizing:border-box;width:104px;height:46px;font:500 20px var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);text-align:right}
.calc-box{box-sizing:border-box;width:104px;height:46px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:pointer}
.calc-box .num{font:500 17px var(--f-mono)}
.calc-box input{width:16px;height:16px;margin:0;flex:none;accent-color:var(--accent)}
.calc-box[data-off="true"]{cursor:not-allowed;opacity:.5}
.calc-in:disabled{cursor:not-allowed;opacity:.5}
.calc-box:has(input:checked){border-color:var(--amber);background:var(--warn-soft)}
.calc-box:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.calc-seg{box-sizing:border-box;min-height:46px;align-self:flex-start;align-items:stretch;flex-wrap:wrap;max-width:100%}
.calc-seg button{min-height:38px;white-space:nowrap}
.calc-seg button{display:flex;align-items:center;padding-inline:14px}
.calc-tg{display:flex;gap:10px;flex-wrap:wrap}
.tog.big{font-size:15px;padding:0 14px;gap:9px;color:var(--ink);height:46px;justify-content:flex-start}
.tog.big b{font-family:var(--f-mono);font-weight:500;color:var(--ink-2)}
.tog.big input{width:16px;height:16px}
.tog.big:has(input:checked){border-color:var(--amber);background:var(--warn-soft)}

.ctrls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ac-row{display:flex;align-items:center;gap:10px}
@media (max-width:560px){.ctrls{align-items:stretch;width:100%}.ac-row{flex-wrap:wrap}}
.tog.cnt{cursor:default;padding:4px 6px 4px 10px}
.tog.cnt .cnt-in{width:64px;padding:5px 6px;font-size:14px}
.scen-sep{width:1px;align-self:stretch;background:var(--line);margin-inline:2px}
@media (max-width:560px){.scen-sep{display:none}}
tr.grp td{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding-top:18px;border-bottom:1px solid var(--line);background:var(--panel)}
tr.grp.g-ap td{color:var(--warn)}
tr.g-ap td,tr.g-ap td:first-child{background:var(--warn-soft)}
tr.grp.g-ap td{background:var(--panel)}
tr.g-x td{color:var(--muted)}
tr.grp.g-x td{color:var(--muted)}
tr.subt td{font-weight:600;color:var(--ink);border-bottom:1px solid var(--line)}
tr.subt td:first-child{color:var(--ink-2);font-weight:500}
tr.disb td{border-top:12px solid var(--panel)}
.svc-row{grid-template-columns:minmax(0,1fr) auto auto auto}
.legend{margin-top:22px}
#kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){#kpis{grid-template-columns:minmax(0,1fr)}}
.fuel-in{width:7ch;min-width:0;font:inherit;font-family:var(--f-mono);font-size:26px;font-weight:500;color:var(--ink);background:var(--panel-2);border:1px dashed var(--line);border-radius:7px;padding:2px 8px;text-align:right}
.fuel-in:hover{border-color:var(--muted)}
.fuel-in:focus{outline:2px solid var(--amber);outline-offset:1px;border-style:solid}
.fuel-in[readonly]{background:transparent;border-color:transparent;padding-inline:0}
.fuel-in.bad{border-color:var(--crit)}
.kpi .s.ok{color:var(--good)} .kpi .s.err{color:var(--crit)}
.kpi .v:has(.fuel-in){display:flex;align-items:center}
.kpi .v .unit{font-size:15px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:.02em}
/* ---- tabs & admin ---- */
.tabs{display:inline-flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:600 15px/1 var(--f-body);border:0;background:transparent;color:var(--ink-2);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.btn{font:600 14px/1 var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.danger{color:var(--crit);border-color:var(--crit);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--panel-2)}
.btn.sm{font-size:12.5px;padding:6px 9px}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field input,.field select,.field textarea,.cell-in,.svc-in{font:15px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink);width:100%}
.field textarea{min-height:64px;resize:vertical}
.field .help{font-size:12px;color:var(--muted)}
.field input.bad{border-color:var(--crit)}
.icao-in{font-family:var(--f-display)!important;font-weight:700;font-size:24px!important;letter-spacing:.06em;text-transform:uppercase}
.form-grid{display:grid;grid-template-columns:150px 190px 140px minmax(0,1fr);gap:14px;align-items:start}
.pct{position:relative}
.pct input{padding-right:26px}
.pct::after{content:"%";position:absolute;right:10px;bottom:9px;color:var(--muted);font-size:14px}
.svc-list{display:flex;flex-direction:column;gap:6px}
.cnt-in{width:62px;font:15px var(--f-mono);padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);text-align:right}
.unit-sel{font:13px var(--f-body);padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink)}
.svc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center}
.svc-row .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.svc-row .chk input{accent-color:var(--accent)}
.h-tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.h-tab{font:600 13px/1 var(--f-body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer}
.h-tab[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.add-h{display:flex;gap:6px}
.add-h input{font:14px var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink);width:190px}
.grid-tbl td,.grid-tbl th{padding:5px 6px}
.grid-tbl td:first-child{font-size:14px;padding-right:12px;min-width:170px}
.cell-in{font-family:var(--f-mono)!important;font-size:14px!important;text-align:right;padding:6px 8px!important;min-width:84px;width:100px}
.cell-in.txtv{font-family:var(--f-body)!important;color:var(--ink-2)}
.colhead{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.colhead .cp{font:500 11px var(--f-body);border:0;background:none;color:var(--accent);cursor:pointer;padding:0;letter-spacing:0}
.colhead .cp:hover{text-decoration:underline}
.savebar{position:sticky;bottom:0;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 -6px 18px rgba(10,20,30,.08)}
.savebar .msg{font-size:14px;color:var(--ink-2)}
.savebar .msg.ok{color:var(--good)}
.savebar .msg.err{color:var(--crit)}
.savebar .msg.dirty{color:var(--warn)}
.savebar .acts{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--crit);flex-wrap:wrap}
.state{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.state h3{margin:0;font-family:var(--f-display);font-size:24px}
.state p{margin:0;color:var(--ink-2);max-width:460px}
.ro-note{font-size:13px;color:var(--muted)}
.upd{font-size:12px;color:var(--muted)}
@media (max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid .notes-f{grid-column:1/-1}}
.trip{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;padding:20px 22px}
.legs{display:flex;flex-direction:column;gap:14px;min-width:0}
.leg{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.leg-l{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.02em;width:96px;padding-bottom:11px;color:var(--ink)}
.lf{display:flex;flex-direction:column;gap:6px;min-width:0}
#view-panel .main{grid-template-columns:minmax(0,1fr) 330px}
#view-panel .roster{order:2}
@media (max-width:900px){#view-panel .main{grid-template-columns:minmax(0,1fr)}#view-panel .roster{order:0}}
.stale{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:0;flex:none}
.stale.g{background:var(--good)}
.stale.o{background:var(--amber)}
.stale.r{background:var(--crit)}
.upd-line{flex-basis:100%;display:flex;align-items:center;font-size:12.5px;color:var(--muted);padding-left:2px}
.ap .price.upd{white-space:nowrap;color:var(--muted);font-size:12px}
.sect-seg{display:inline-grid;grid-template-columns:repeat(3,1fr)}
.sect-seg button{font:600 13px/1 var(--f-body);letter-spacing:.02em;padding:8px 14px;text-align:center}
.cal{position:fixed;z-index:30;width:272px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(10,20,30,.18);padding:10px;font-family:var(--f-body)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.cal-h b{font:600 15px var(--f-body)}
.cal-h button,.cal-d{font:inherit;border:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:6px}
.cal-h button{width:32px;height:32px;font-size:18px;line-height:1;color:var(--ink-2)}
.cal-h button:hover,.cal-d:hover{background:var(--panel-2)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-w{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);padding:4px 0}
.cal-d{height:34px;font-size:13.5px;font-variant-numeric:tabular-nums}
.cal-d.we{color:var(--ink-2)}
.cal-d.today{box-shadow:inset 0 0 0 1px var(--accent)}
.cal-d.sel{background:var(--accent);color:var(--panel);font-weight:600}
.cal-d:focus-visible,.cal-h button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.cal-f{margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center}
.lf-loc{padding-left:14px;border-left:1px solid var(--line)}
.loc{box-sizing:border-box;height:46px;min-width:170px;display:flex;align-items:center;gap:10px;padding:0 18px 0 6px;border:1px solid var(--accent);border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.loc .lc-i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--panel);display:grid;place-items:center}
.loc .lc-i svg{width:18px;height:18px}
.loc .lc-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.loc b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.loc small{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.ac-card{padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ac-card .flabel{font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.calc-in.dt{width:150px;text-align:left;font-size:16px;font-variant-numeric:tabular-nums}
.calc-in.tm{width:112px;text-align:left;font-size:16px}
.calc-in.px{width:84px}
.calc-in.tm{font-variant-numeric:tabular-nums}
.calc-in.bad{border-color:var(--bad,#c0392b)}
.trip-side{margin-left:auto}
.trip-sum{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line-soft);padding-top:14px}
.ts{font-size:13px;color:var(--ink-2);padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.ts b{font-weight:600;color:var(--ink)}
.ts.on{background:var(--warn-soft);border-color:var(--amber);color:var(--warn);font-weight:600}
.ts.warn{color:var(--crit);border-color:var(--crit);background:transparent}

.pk-btn{width:100%;min-width:150px;text-align:left;font:inherit;font-size:12.5px;line-height:1.35;padding:7px 9px;border-radius:8px;border:1px dashed var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pk-btn:hover,.pk-btn.on{border-style:solid;border-color:var(--muted)}
.pk-btn:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.pk-d{display:block;white-space:normal;max-width:170px;margin-left:auto;font-size:10.5px;line-height:1.3;overflow-wrap:anywhere}
.pk-ed{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.pk-h{font-size:14px;color:var(--muted)}
.pk-h b{color:var(--ink)}
.pk-grid{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-start}
.pk-f{width:120px}
.pk-f span,.pk-lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

.pk-bands,.pk-then{display:flex;flex-direction:column;gap:8px;min-width:0}

.pk-then .help{font-size:12px;color:var(--muted);max-width:300px}
.pk-prev{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.pk-ex{font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}

.pk-act{display:flex;gap:8px;justify-content:flex-end}
.pk-freecol{display:flex;flex-direction:column;gap:8px;max-width:220px}
.pk-chk{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.hnote{color:var(--warn);font-size:12px;cursor:help;margin-left:2px}
.h-type{display:block;font-size:.7em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-top:2px;line-height:1.25}

.upd-d{font-size:11px;color:var(--muted);font-family:var(--f-mono);cursor:help}
.upd-prev{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal;overflow-wrap:anywhere;max-width:150px;margin-left:auto;font-size:10.5px;line-height:1.3;color:var(--muted)}
.cfm-ov{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.cfm-box{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);max-width:420px;width:100%;padding:18px 18px 14px}

.cfm-a{display:flex;justify-content:flex-end;gap:8px}
.upd-calc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:10.5px;line-height:1.3;color:var(--muted);font-family:var(--f-mono);white-space:normal;max-width:150px;margin:2px 0 0 auto;text-align:right;overflow-wrap:anywhere;cursor:help}

.svc-nm{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.25}

n","SKBO":"America/Bogota","SKCL":"America/Bogota","TDPD":"America/Dominica","TGPY":"America/Grenada","TNCC":"America/Curacao","UAAA":"Asia/Almaty","UACC":"Asia/Almaty","UBBB":"Asia/Baku","UCFM":"Asia/Bishkek","UDYZ":"Asia/Yerevan","UGSB":"Asia/Tbilisi","UTAA":"Asia/Ashgabat","UTAM":"Asia/Ashgabat","UTDD":"Asia/Dushanbe","UTDL":"Asia/Dushanbe","UTTT":"Asia/Tashkent","VRDA":"Indian/Maldives","VRMM":"Indian/Maldives","VDTI":"Asia/Phnom_Penh","VTBD":"Asia/Bangkok","VTBU":"Asia/Bangkok","VVCR":"Asia/Ho_Chi_Minh","VVTS":"Asia/Ho_Chi_Minh","ZMCK":"Asia/Ulaanbaatar","ZSPD":"Asia/Shanghai","LFSB":"Europe/Paris"};

function utcToLocal(D,T,tz){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(D||""), t=/^(\d{1,2}):(\d{2})$/.exec(T||""); if(!m||!t) return null;
  const ms=Date.UTC(+m[1],+m[2]-1,+m[3],+t[1],+t[2]); if(!tz) return {D,T,off:0,none:true};

  const L=Date.UTC(+m[1],+m[2]-1,+m[3],+t[1],+t[2]); let u=L;
  for(let i=0;i<3;i++){ const d=new Date(u), r=utcToLocal(dstr0(d),pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes()),tz); if(!r||r.none) break; u=L-r.off*6e4; }

/* parking kuralı: {pk:1, free:saat, bands:[[saate kadar, fiyat],...], every:saat (0 = kalış başına bir kez), price:fiyat (boşsa son kademe fiyatı)}
   parking her zaman saatlik hesaplanır; eski kayıtlarda tek rakam = 24 saatlik fiyat */
const PK_SHORT=["LFPB"];
const pkShort=(v,cur)=>{const t=trip(), H=t.ok?t.hrs:24; return fmt(pkCost(v,H)??0,cur)+" · "+fmtStay(H);};
const isPk=v=>!!(v&&typeof v==="object"&&v.pk);
const pkOf=v=>isPk(v)?v:isNum(v)?{pk:1,free:0,bands:[],every:1,price:Math.round(v/24*1e4)/1e4}:null; // eski tek rakam = 24 saatlik fiyat, saatliğe bölünür
const pkNights=()=>{ const t=trip(); if(!t.ok) return 0; const n=Math.round((Date.parse(state.depD+"T00:00:00Z")-Date.parse(state.arrD+"T00:00:00Z"))/864e5); return n>0?n:0; };
function pkCost(v,H){
  const r=pkOf(v); if(!r) return null;
  /* perNight: gece başına (ör. CYVR Skyservice overnight ramp parking): kalışta geçilen yerel gece yarısı sayısı × price */
  if(r.perNight&&isNum(r.price)) return Math.round(pkNights()*r.price*100)/100;
  H=Math.max(H,0); const free=r.free||0, bands=(r.bands||[]).filter(b=>isNum(b[0])&&isNum(b[1])).sort((x,y)=>x[0]-y[0]);
  if(H<=free+1e-9) return 0;
  /* tiers + rate: kalış süresine göre çarpan (DIAL Delhi): ücretsiz saatten sonra faturalanan saatler kademeli; tiers=[[toplam kalış saati üst sınırı, çarpan],...]; wholeAfter: kalış bu saati aşarsa bütün faturalanan saatler son çarpanla */
  if(isNum(r.rate)&&Array.isArray(r.tiers)&&r.tiers.length){ const b=Math.max(0,Math.ceil(H-free-1e-9)), T=r.tiers.slice().sort((x,y)=>x[0]-y[0]), lastM=T[T.length-1][1];
    if(isNum(r.wholeAfter)&&H>r.wholeAfter+1e-9) return Math.round(b*lastM*r.rate*100)/100;
    let s=0, prev=0; for(const [up,m] of T){ const cap=up-free; s+=Math.max(0,Math.min(b,cap)-prev)*m; prev=Math.max(prev,cap); if(b<=cap) break; }
    if(b>prev) s+=(b-prev)*lastM; return Math.round(s*r.rate*100)/100; }
  /* price2 + after2: ücretsiz saatten sonra her başlayan saat "price"; faturalanan ilk after2 saatten sonrası "price2" (ör. Biggin Hill: ilk 24 saat 42, sonrası 33.60) */
  if(isNum(r.price2)&&isNum(r.after2)&&isNum(r.price)){ const b=Math.max(0,Math.ceil(H-free-1e-9)); if(isNum(r.price3)&&isNum(r.after3)) return Math.round((Math.min(b,r.after2)*r.price+Math.max(0,Math.min(b,r.after3)-r.after2)*r.price2+Math.max(0,b-r.after3)*r.price3)*100)/100; return Math.round((Math.min(b,r.after2)*r.price+Math.max(0,b-r.after2)*r.price2)*100)/100; }

let FUEL={price:null,updatedAt:null}, fuelMsg="", fuelCls="";
const fuelTxt=v=>isNum(v)?Number(v).toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:4}):"";
function showFuel(){ const i=document.getElementById("fuelIn"), sub=document.getElementById("fuelSub"); if(!i||!sub) return;
  i.readOnly=canWrite===false||!DB; if(document.activeElement!==i) i.value=fuelTxt(FUEL.price);
  /* yaş: 1 aydan kısa yeşil, 1–3 ay turuncu, 3 aydan uzun kırmızı */

    dot.hidden=!ok; if(ok){ const days=(Date.now()-d.getTime())/864e5, l=days>91.3?"r":days>30.4?"o":"g"; dot.className="stale "+l; const t=l==="r"?"Fuel price not updated for over 3 months":l==="o"?"Fuel price not updated for over 1 month":"Fuel price entered within the last month"; dot.title=t; dot.setAttribute("aria-label",t); dot.setAttribute("role","img"); } }
  sub.className="s "+fuelCls; sub.textContent=fuelMsg||(isNum(FUEL.price)?(FUEL.updatedAt?"Last entry "+fmtDate(FUEL.updatedAt):""):(i.readOnly?"No fuel price entered":"Type the price and press Enter")); }
function bindFuel(){ const i=document.getElementById("fuelIn"); if(!i) return;
  const save=async()=>{ if(i.readOnly) return; const raw=i.value.trim().replace(/\s/g,"").replace(",","."); 
    if(raw===""){ if(FUEL.price===null) return; } else if(!/^\d*\.?\d+$/.test(raw)||Number(raw)<=0){ fuelMsg="Price must be a positive number (e.g. 2.845)."; fuelCls="err"; i.classList.add("bad"); showFuel(); return; }
    const v=raw===""?null:Math.round(Number(raw)*1e4)/1e4; i.classList.remove("bad"); if(v===FUEL.price){ fuelMsg=""; fuelCls=""; i.value=fuelTxt(v); showFuel(); return; }
    try{ const body={price:v,updatedAt:new Date().toISOString()}; await DB.doc("settings/fuel").set(body); FUEL=body; fuelMsg="Saved"; fuelCls="ok"; }
    catch(e){ fuelMsg=e&&e.code==="invalid_argument"?"You do not have permission to change the fuel price.":"Could not save. Try again."; fuelCls="err"; }
    i.value=fuelTxt(FUEL.price); showFuel(); setTimeout(()=>{ if(fuelCls==="ok"){ fuelMsg=""; fuelCls=""; showFuel(); } },2500); };
  i.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); i.blur(); } else if(e.key==="Escape"){ i.value=fuelTxt(FUEL.price); i.classList.remove("bad"); fuelMsg=""; fuelCls=""; i.blur(); } };
  i.onblur=save; }

  const tip=[u.a?"Approximate (latest source document of this handler)":"Price confirmed by document",u.src?"Source: "+u.src:"",pv?"Previous: "+pv+(u.pd?" ("+updDmy(u.pd)+")":""):""].filter(Boolean).join(" · ");

function drawCal(){ if(!cal) return; const [y,m]=cal.m.split("-").map(Number), start=(new Date(y,m-1,1).getDay()+6)%7, n=new Date(y,m,0).getDate(), sel=state[cal.u], td=dstr(new Date());

  cal.el.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{ const d=new Date(y,m-1+(+b.dataset.mv),1); cal.m=d.getFullYear()+"-"+pad2(d.getMonth()+1); drawCal(); });

function parseCell(s){

  if(s[0]==="{"){ try{ const o=JSON.parse(s); if(o&&typeof o==="object") return o; }catch(e){} }
  let n=s.replace(/\s/g,"");
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(n)) n=n.replace(/\./g,"").replace(",",".");
  else if(/^-?\d+,\d+$/.test(n)) n=n.replace(",",".");
  else n=n.replace(/,/g,"");
  return /^-?\d+(\.\d+)?$/.test(n)?Number(n):s;

    if(state.tab==="admin") renderFx();
  },err=>{ loadErr="Database connection lost. Reload the page."; renderPanel(); });
  DB.doc("settings/fuel").onSnapshot(s=>{ FUEL=s.exists?(s.data()||{}):{price:null,updatedAt:null}; if(!isNum(FUEL.price)) FUEL.price=null; showFuel(); },()=>{});
  DB.doc("settings/fx").onSnapshot(s=>{
    FX=s.exists?(s.data()||{rates:{}}):{rates:{}}; if(!FX.rates) FX.rates={};
    if(state.tab==="panel"){ if(loaded&&DATA.length) renderDetail(true); } else { const active=document.activeElement; if(!(active&&active.dataset&&active.dataset.fx)) renderFx(); }
  },()=>{});
})();
</script>
